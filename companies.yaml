    note: "this SmartRecruiters instance only carries ASICS' Australia/Oceania retail postings (confirmed: totalFound=50, all AU) -- filtered out downstream by the location scorer anyway, so low-cost to keep. ASICS EMEA has its own NL-specific portal at asics.com/nl/en-nl/mk/careers/search-jobs/566 (found via web search, e.g. a Business Intelligence Engineer role in Hoofddorp), but it's behind an Akamai WAF that returns a hard Access Denied to both a plain curl and a browser-like User-Agent -- respected per the hard rule, not evaded. Revisit manually if ASICS NL hiring becomes a priority."
