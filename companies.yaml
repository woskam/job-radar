    ats: "workday"
    workday_host: "nike.wd1.myworkdayjobs.com"
    workday_site: "nke"
    note: "was wrongly configured as workday_site 'nke2' (US-only retail-store board, 320 postings, no NL); the real global/corporate site is 'nke' (744 postings incl. Amsterdam/Hilversum/Utrecht) -- found via the embedded apply links on careers.nike.com/nl/jobs, confirmed 2026-08-24"
