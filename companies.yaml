# Companies to scrape career pages for. `ats` is the underlying platform
# (looked up per company, see notes) — determines which scraper a company can
# reuse. `custom` means: no known shared platform found, requires its own
# scraper per company.
#
# Platform clusters (for prioritizing which scraper to build first):
#   Workday (14x)           : Nike, PUMA, New Balance, VF Corp, Columbia Sportswear,
#                             PVH, Levi Strauss, Zalando, Unilever, Philips,
#                             Samsung Benelux, Sony Benelux, NIBC Bank, Accenture
#   SAP SuccessFactors (8x) : adidas, Under Armour, MediaMarkt NL, C&A, Heineken,
#                             Triodos Bank, Knab, EY
#   Radancy/TalentBrew (3x) : IKEA Netherlands, ING, politie
#   Dropr (2x)              : Action, ICI Paris XL
#   Google Careers (1x)     : Google (reverse-engineered internal Closure/WIZ
#                             page-data format, not a documented API)
#   SmartRecruiters (3x)    : ASICS, Wehkamp, Roland Berger
#   Eightfold AI (2x)       : Netflix, HSBC Netherlands
#   Phenom (5x)             : eBay, ASN Bank, Mars Benelux, Procter & Gamble Benelux, BCG
#   GetNoticed (2x)         : KPN, T-Mobile Netherlands (now Odido)
#   Avature (1x)            : L'Oréal Benelux
#   Oracle Recruiting Cloud (4x): Uber, JPMorgan Amsterdam, American Express Benelux,
#                             Citibank Amsterdam (search layer)
#   Greenhouse (3x)         : bol.com, Anthropic, GitLab
#   Ashby (1x)              : Mistral AI
#   Jobylon (1x)            : HEMA
#   Homerun (1x)            : Douglas
#   BrassRing (1x)          : Guess
#   Recruitee (1x)          : bunq
#   Deel (1x)               : Klarna
#   iCIMS (2x)              : Booking.com, PepsiCo Benelux (not built: modern Jibe/
#                             Angular template, no plain-HTTP-replayable API found yet)
#   WBA (1x)                : gemeente_amsterdam
#   TSF (1x)                : provincie_noord_holland
#   werkenvoornederland.nl (6x): AIVD, MIVD, Rijkswaterstaat, Belastingdienst, Douane, DUO
#   UWV (1x)                : UWV
#   custom-built site, own scraper (2x): Mollie, VodafoneZiggo
#   custom/unknown, not yet built (26x): G-Star RAW, Scotch & Soda, Suitsupply,
#                             WE Fashion, Coolblue, Just Eat Takeaway.com,
#                             Picnic, Otrium, Ahold Delhaize, Albert Heijn, Jumbo,
#                             Nestlé Nederland, Magnum Ice Cream Company,
#                             Adyen, TikTok, Amazon NL, Salesforce, Shopify,
#                             HubSpot, Automattic, ABN AMRO, Van Lanschot Kempen,
#                             Goldman Sachs Amsterdam, BNP Paribas Netherlands,
#                             Bain & Company, Deloitte, KPMG, Capgemini (SF Career
#                             Site Builder front-end, but client-side rendered),
#                             Oliver Wyman (Phenom, but shares an unfilterable
#                             multi-brand Marsh McLennan tenant)
#   blocked (active bot protection, out of scope): Rabobank (WAF), Nestlé (Cloudflare
#                             challenge), Magnum (403), Microsoft (reCAPTCHA on
#                             jobs.careers.microsoft.com; the Eightfold-based
#                             apply.careers.microsoft.com API also 403s with
#                             "Not authorized for PCSX"), OpenAI (403), Shopify
#                             (rate-limited, respected not bypassed), Goldman Sachs
#                             (requires an authenticated Okta session), McKinsey
#                             (every request hangs/resets, HTTP/2 and HTTP/1.1 both),
#                             Kearney (403, Cloudflare)
#
# See README.md for the field schema per `ats` type, and how to add a new company.
#
# `segment: "startup"` marks a company sourced from a VC portfolio
# (currently: YCombinator's public "hiring" directory, see
# bulk_add_from_yc.py) rather than picked as an established employer --
# purely informational, not read by any scoring logic. Absent means the
# default (large/established company), same as every entry above/below
# this comment that predates the field.
#
# The clusters above cover the ~115 hand-picked large/established
# companies. A further 292 startups/scale-ups (segment: "startup",
# ats: ashby or greenhouse almost exclusively) live in their own section
# near the end of this file -- see that section's own header comment.
companies:
  # Sportswear & outdoor
  - name: "adidas"
    category: "sportswear"
    career_url: "https://careers.adidas-group.com/jobs"
    ats: "custom"
